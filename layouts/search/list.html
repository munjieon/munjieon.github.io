{{ define "main" }}
<header class="list-header"><h1>{{ .Title }}</h1></header>
<link href="{{ "pagefind/pagefind-ui.css" | relURL }}" rel="stylesheet">
<div id="search"></div>
<noscript><p>검색에는 자바스크립트가 필요합니다.</p></noscript>
<script src="{{ "pagefind/pagefind-ui.js" | relURL }}"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    if (window.PagefindUI) {
      new PagefindUI({ element: "#search", showSubResults: true, translations: { placeholder: "검색어를 입력하세요", zero_results: "[SEARCH_TERM]에 대한 결과가 없습니다" } });
    } else {
      document.getElementById('search').textContent = '검색 색인은 배포된 사이트에서만 동작합니다.';
    }
  });
</script>
{{ end }}
