name: 빌드와 배포

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.160.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hugo 설치
        run: |
          wget -q -O hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i hugo.deb
          hugo version
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 글 번호 확인
        run: python3 scripts/post-numbers.py check
      - name: 사이트 빌드
        run: hugo --gc --minify
      - name: 검색 색인 만들기
        run: npx -y pagefind@1.3.0 --site public
      - name: 결과 확인
        run: |
          test -f public/index.html
          test -f public/about/index.html
          test -f public/finds/index.html
          test -f public/pagefind/pagefind-ui.js
          ls public
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
